name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install --no-deps xgboost
          pip install pytest httpx

      - name: Run tests
        run: pytest

  docker-build:
    name: Build, smoke-test, and optionally publish Docker image
    runs-on: ubuntu-latest
    needs: tests

    env:
      API_IMAGE_NAME: ghcr.io/${{ github.repository }}/bank-marketing-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build

      - name: Start API container
        run: docker compose up -d api

      - name: Smoke-test API health endpoint
        run: |
          for i in {1..20}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs api
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Normalize image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "API_IMAGE_NAME=${API_IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ads2-bank-marketing-project-api:latest $API_IMAGE_NAME:${{ github.sha }}
          docker tag ads2-bank-marketing-project-api:latest $API_IMAGE_NAME:latest

      - name: Push API image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $API_IMAGE_NAME:${{ github.sha }}
          docker push $API_IMAGE_NAME:latest
